name: Sync Player Configs

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

concurrency:
  group: hifi-files-auto-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and validate latest player_configs.json
        run: |
          TMP_FILE="$(mktemp)"
          trap 'rm -f "$TMP_FILE"' EXIT
          curl -fsSL --max-time 20 "https://raw.githubusercontent.com/maxrave-dev/SimpMusic-files/main/registry/player_configs.json" -o "$TMP_FILE"
          python scripts/validate-player-config.py "$TMP_FILE"
          mv "$TMP_FILE" registry/player_configs.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/player_configs.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(registry): update player_configs.json [skip ci]"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main failed due to conflict. Aborting without force-push."
              git rebase --abort || true
              exit 1
            fi
            python scripts/validate-player-config.py registry/player_configs.json
            git push origin main
          else
            echo "No changes in player_configs.json"
          fi

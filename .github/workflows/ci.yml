name: CI Tests and Config Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate remote configs
        run: python scripts/validate-config.py

      - name: Validate player configs
        run: python scripts/validate-player-config.py


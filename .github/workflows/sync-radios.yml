name: Auto-Heal Live Radio Streams

on:
  schedule:
    - cron: '0 * * * *' # Every 1 hour (best-effort GitHub Actions schedule)
  workflow_dispatch:

concurrency:
  group: hifi-files-auto-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-radios:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp fallback resolver
        run: pip install -q --upgrade yt-dlp

      - name: Run Balanced Live Radio Sync (6h grace policy)
        run: python scripts/sync-radios.py --mode health-check

      - name: Validate Configurations
        run: python scripts/validate-config.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add remote-config.json remote-config-dev.json registry/radio-status.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-heal): update live radio stream IDs [skip ci]"
            BEFORE_REMOTE="$(git rev-parse origin/main)"
            git fetch origin main
            AFTER_REMOTE="$(git rev-parse origin/main)"
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main failed due to conflict. Aborting without force-push."
              git rebase --abort || true
              exit 1
            fi
            if [ "$BEFORE_REMOTE" != "$AFTER_REMOTE" ]; then
              if git diff --name-only "$BEFORE_REMOTE" "$AFTER_REMOTE" | grep -Eq '^(remote-config(-dev)?\.json|scripts/)'; then
                echo "Remote base changed during run; rebuilding and revalidating output..."
                python scripts/sync-radios.py --mode health-check
                git add remote-config.json remote-config-dev.json registry/radio-status.json
                if ! git diff --staged --quiet; then
                  git commit --amend --no-edit
                fi
              fi
            fi
            python scripts/validate-config.py
            git push origin main
          else
            echo "No changes in remote configs or radio status registry."
          fi

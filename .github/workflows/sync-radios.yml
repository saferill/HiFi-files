name: Auto-Heal Live Radio Streams

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours (00:00, 02:00, 04:00, ... UTC)
  workflow_dispatch:

concurrency:
  group: sync-radios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-radios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp fallback resolver
        run: pip install -q --upgrade yt-dlp

      - name: Run Auto-Heal Live Radio Sync
        run: python scripts/sync-radios.py

      - name: Validate Configurations
        run: python scripts/validate-config.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add remote-config.json remote-config-dev.json registry/radio-status.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(auto-heal): update active 24/7 live radio stream IDs [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in remote configs or radio status registry."
          fi
